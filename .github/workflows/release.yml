name: Release

# Obsidian plugin release, per the Obsidian guidelines:
# push a tag that equals manifest.json's "version" exactly (for example 1.0.0, no "v" prefix).
# The workflow checks the repo, then creates a GitHub release named after the tag with
# main.js, manifest.json and styles.css attached as individual files (Obsidian and BRAT download these).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release files exist
        run: |
          for f in main.js manifest.json styles.css versions.json; do
            test -f "$f" || { echo "Missing $f at the repo root"; exit 1; }
          done

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $version"
            exit 1
          fi

      - name: Check manifest.json and versions.json
        run: |
          node -e '
            const m = require("./manifest.json");
            const v = require("./versions.json");
            for (const k of ["id", "name", "version", "minAppVersion", "description", "author"]) {
              if (!m[k]) { console.error("manifest.json is missing " + k); process.exit(1); }
            }
            if (/obsidian/i.test(m.id)) { console.error("The plugin id must not contain \"obsidian\""); process.exit(1); }
            if (!v[m.version]) { console.error("versions.json has no entry for " + m.version); process.exit(1); }
          '

      - name: Check main.js parses
        run: node --check main.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
